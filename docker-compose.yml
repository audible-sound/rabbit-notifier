name: incident-report

services:
  rabbitmq:
    image: rabbitmq:4-alpine
    restart: always
    ports:
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=pbc
      - RABBITMQ_DEFAULT_PASS=password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  web-service:
    build: ./web-service
    ports: 
      - "3000:3000"
    command: ["uvicorn", "main:app", 
              "--host", "0.0.0.0", 
              "--port", "3000",
              "--reload"]
    depends_on:
      - rabbitmq
    volumes:
      - ./web-service:/app

  email-service:
    build: ./email-service
    ports:
      - "3001:3001"
    command: ["uvicorn", "main:app",
              "--host", "0.0.0.0",
              "--port", "3001",
              "--reload"]
    depends_on:
      - rabbitmq
    volumes:
    - ./email-service:/app

volumes:
  rabbitmq_data:
